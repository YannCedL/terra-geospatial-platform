[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-geospatial-platform"
version = "2.0.0"
description = "Geospatial Intelligence Platform aggregating all geo engines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Genesis OSINT Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "genesis-core>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "waypoint-site-intelligence>=1.0.0",
    "orbit-geospatial-exposure>=2.0.0",
    "odyssey-corporate-world-map>=2.0.0",
    "arena-competitive-geography>=2.0.0",
    "delta-change-detection>=2.0.0",
    "silkroad-supply-chain>=2.0.0",
    "bedrock-infrastructure-intel>=2.0.0",
    "aquila-aviation-intel>=2.0.0",
    "nereid-maritime-intel>=2.0.0",
    "northstar-image-geolocation>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
