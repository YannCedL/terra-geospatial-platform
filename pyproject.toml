[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-geospatial-platform"
version = "2.0.0"
description = "Geospatial Intelligence Platform aggregating all geo engines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Genesis OSINT Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "genesis-core>=0.0.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "waypoint-site-intelligence>=0.0.6",
    "orbit-geospatial-exposure>=0.0.6",
    "odyssey-corporate-world-map>=0.0.6",
    "arena-competitive-geography>=0.0.6",
    "delta-change-detection>=0.0.6",
    "silkroad-supply-chain>=0.0.6",
    "bedrock-infrastructure-intel>=0.0.6",
    "aquila-aviation-intel>=0.0.6",
    "nereid-maritime-intel>=0.0.6",
    "northstar-image-geolocation>=0.0.6"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
