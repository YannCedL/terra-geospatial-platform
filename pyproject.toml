[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-geospatial-platform"
version = "2.0.0"
description = "Geospatial Intelligence Platform aggregating all geo engines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Genesis OSINT Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "genesis-core @ git+https://github.com/YannCedL/genesis-core.git",
    "waypoint-site-intelligence @ git+https://github.com/YannCedL/waypoint-site-intelligence.git",
    "orbit-geospatial-exposure @ git+https://github.com/YannCedL/orbit-geospatial-exposure.git",
    "odyssey-corporate-world-map @ git+https://github.com/YannCedL/odyssey-corporate-world-map.git",
    "arena-competitive-geography @ git+https://github.com/YannCedL/arena-competitive-geography.git",
    "delta-change-detection @ git+https://github.com/YannCedL/delta-change-detection.git",
    "silkroad-supply-chain @ git+https://github.com/YannCedL/silkroad-supply-chain.git",
    "bedrock-infrastructure-intel @ git+https://github.com/YannCedL/bedrock-infrastructure-intel.git",
    "aquila-aviation-intel @ git+https://github.com/YannCedL/aquila-aviation-intel.git",
    "nereid-maritime-intel @ git+https://github.com/YannCedL/nereid-maritime-intel.git",
    "northstar-image-geolocation @ git+https://github.com/YannCedL/northstar-image-geolocation.git",
    "argus-company-research @ git+https://github.com/YannCedL/argus-company-research.git"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.package-data]
terra_geospatial_platform = [
    "templates/**/*.html",
    "templates/*.html",
    "static/**/*",
    "static/*"
]

