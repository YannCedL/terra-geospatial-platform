<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERRA — Geospatial & Infrastructure Platform 360°</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #060911;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #10b981, #047857);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .logo-title { font-size: 1.4rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .map-container {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            min-height: 550px;
        }

        #map { width: 100%; height: 100%; min-height: 550px; }

        .badge {
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🌍</div>
            <div>
                <div class="logo-title">TERRA</div>
                <div class="logo-subtitle">Plateforme Cartographique & Géospatiale 360°</div>
            </div>
        </div>
        <div class="badge">MOTEURS CONNECTÉS (BEDROCK + WAYPOINT + AQUILA)</div>
    </header>

    <div class="map-container">
        <div id="map"></div>
    </div>

    <script>
        let map = L.map('map').setView([48.8566, 2.3522], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'TERRA Geospatial Platform'
        }).addTo(map);

        let infraLayer = L.layerGroup().addTo(map);
        let planeLayer = L.layerGroup().addTo(map);

        async function chargerPlateformeGéo() {
            try {
                const response = await fetch('/api/v1/report?lat=48.8566&lon=2.3522');
                const contract = await response.json();
                const res = contract.result;

                // 1. Marqueurs Infrastructures
                (res.infrastructures || []).forEach(infra => {
                    L.circleMarker([infra.lat, infra.lon], {
                        radius: 8, fillColor: '#f59e0b', color: '#d97706', weight: 2, fillOpacity: 0.8
                    }).addTo(infraLayer).bindPopup(`<strong>🏭 ${infra.name}</strong><br/>Type: ${infra.type}`);
                });

                // 2. Marqueurs Avions Live
                (res.live_flights || []).forEach(flight => {
                    L.marker([flight.lat, flight.lon]).addTo(planeLayer).bindPopup(`<strong>✈️ Vol ${flight.callsign}</strong><br/>Altitude: ${flight.altitude_m}m`);
                });

            } catch (err) {
                console.error("Erreur lors de l'agrégation TERRA.");
            }
        }

        window.onload = chargerPlateformeGéo;
    </script>
</body>
</html>
